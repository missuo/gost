name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      gost_ref:
        description: "gost 分支 / tag / commit"
        required: false
        default: "feat/pluggable-cc"

env:
  GOST_REPO: https://github.com/missuo/gost.git
  GOST_REF: ${{ github.event.inputs.gost_ref || 'feat/pluggable-cc' }}

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve gost version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Clone gost source
        run: |
          git clone -b "${GOST_REF}" "${GOST_REPO}" gost

      # 用源码里最近的 tag 作为编译出来的版本号,例如 3.2.6
      - name: Resolve version
        id: version
        working-directory: gost
        run: |
          RAW=$(git describe --tags --abbrev=0)
          VERSION="${RAW#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved gost version: ${VERSION}"

  build:
    name: build (linux/${{ matrix.goarch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true

      # 拉取并编译
      - name: Clone gost source
        run: |
          git clone -b "${GOST_REF}" --depth 1 "${GOST_REPO}" gost

      - name: Build gost
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd gost/cmd/gost
          go build -trimpath -ldflags "-s -w" -o gost
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cp gost "${GITHUB_WORKSPACE}/dist/"

      - name: Package artifact
        working-directory: dist
        run: |
          NAME="gost_${{ needs.prepare.outputs.version }}_linux_${{ matrix.goarch }}"
          tar -czf "${NAME}.tar.gz" gost
          rm -f gost

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gost_${{ needs.prepare.outputs.version }}_linux_${{ matrix.goarch }}
          path: dist/*

  release:
    name: Release
    needs: [prepare, build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          files: dist/*
          generate_release_notes: true
